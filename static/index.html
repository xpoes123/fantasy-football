<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Advisor — Touchdowns and Transactions</title>
<style>
  :root{
    --bg:#1a1b26; --panel:#1f2335; --panel2:#24283b; --line:#2f334d;
    --fg:#c0caf5; --dim:#565f89; --mut:#787c99;
    --blue:#7aa2f7; --purple:#bb9af7; --cyan:#7dcfff; --green:#9ece6a;
    --red:#f7768e; --orange:#ff9e64; --yellow:#e0af68; --teal:#73daca;
    --RB:#ff9e64; --WR:#7aa2f7; --QB:#bb9af7; --TE:#9ece6a; --K:#565f89; --DEF:#565f89;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 ui-monospace,"JetBrains Mono",Menlo,monospace}
  a{color:var(--blue)}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600;color:var(--cyan)}
  .pick{font-size:22px;font-weight:700;color:var(--fg)}
  .pick small{font-size:12px;color:var(--dim);font-weight:400}
  .banner{padding:5px 14px;border-radius:6px;font-weight:700;letter-spacing:.5px}
  .mine{background:var(--green);color:#12131c;animation:pulse 1.4s infinite}
  .waiting{background:var(--panel2);color:var(--mut)}
  @keyframes pulse{50%{opacity:.55}}
  .spacer{flex:1}
  label{color:var(--dim);font-size:12px}
  input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:5px;padding:4px 7px;width:52px;font:inherit;text-align:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;
    margin-right:5px;vertical-align:middle}
  main{display:grid;grid-template-columns:1.15fr 1fr .85fr;gap:14px;padding:14px 18px;
    max-width:1500px;margin:0 auto}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  h2{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);
    margin:0 0 10px;font-weight:600}
  .rec{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;
    background:var(--panel2);margin-bottom:7px;border:1px solid transparent}
  .rec.top{border-color:var(--green);background:#1e2a1f}
  .rec .rk{color:var(--dim);width:16px;text-align:center;font-weight:700}
  .rec.top .rk{color:var(--green)}
  .pos{font-weight:700;width:34px;text-align:center;border-radius:4px;padding:1px 0;font-size:12px}
  .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:var(--dim);font-size:12px;white-space:nowrap}
  .meta b{color:var(--mut);font-weight:600}
  .exp{color:var(--teal);font-weight:700;font-size:13px;min-width:56px;text-align:right}
  .row{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid #23263b}
  .row:last-child{border:0}
  .inj{color:var(--yellow);font-size:11px}
  .surv{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap}
  .s-back{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
  .s-likely{color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
  .s-coin{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,transparent)}
  .s-slip{color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,transparent)}
  .s-gone{color:var(--red);background:color-mix(in srgb,var(--red) 16%,transparent)}
  .cliffmark{color:var(--red);font-weight:700;font-size:11px}
  .hc{color:var(--dim);font-size:11px}
  .stack{color:var(--purple);font-size:10px;font-weight:700}
  .block{color:var(--cyan);font-size:10px;font-weight:700}
  #searchresults{margin:0 18px}
  #searchresults:not(:empty){margin:0 18px 10px}
  .sr{display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;margin-bottom:4px;font-size:13px}
  .sr .avail{color:var(--green);font-weight:700;font-size:11px}
  .sr .taken{color:var(--red);font-weight:700;font-size:11px}
  .pairplan{background:color-mix(in srgb,var(--green) 12%,transparent);border:1px solid var(--green);
    border-radius:7px;padding:7px 11px;margin-bottom:9px;font-size:13px;color:var(--fg)}
  .fallhdr{color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase;
    margin:10px 0 5px;border-top:1px solid var(--line);padding-top:8px}
  .byetag{color:var(--dim);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 3px}
  .byeclash{color:var(--red);font-size:10px;border:1px solid var(--red);border-radius:3px;padding:0 3px;font-weight:700}
  .runbar{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange);
    border:1px solid var(--orange);border-radius:6px;padding:5px 10px;margin:0 18px 8px;
    font-size:12.5px;font-weight:600}
  .cliff{font-size:12px;color:var(--dim);padding:3px 0}
  .cliff.steep{color:var(--yellow)}
  .needs{font-size:13px;color:var(--yellow);margin-top:8px}
  .needs.full{color:var(--green)}
  .recent{font-size:12.5px;color:var(--mut)}
  .recent .p{color:var(--dim)}
  #err{color:var(--red);padding:0 18px}
  .foot{color:var(--dim);font-size:11px;text-align:center;padding:8px}
  .sleeper{color:var(--cyan);text-decoration:none;border:1px solid var(--line);
    padding:4px 9px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>DRAFT ADVISOR</h1>
  <div class="pick" id="pick">—</div>
  <div id="banner" class="banner waiting">connecting…</div>
  <div class="spacer"></div>
  <input id="search" type="text" placeholder="🔍 look up any player" style="width:180px;text-align:left">
  <label>your slot <input id="slot" type="number" min="1" max="12" placeholder="auto"></label>
  <span id="slotinfo" style="color:var(--dim);font-size:12px"></span>
  <a class="sleeper" href="https://sleeper.com/draft/nfl/1395399705847947264" target="_blank" rel="noopener">open sleeper ↗</a>
  <span><span class="dot" id="live"></span><span id="clock" style="color:var(--dim);font-size:12px"></span></span>
</header>
<div id="err"></div>
<div id="searchresults"></div>
<div id="runbar"></div>
<main>
  <section>
    <h2>Recommended — your pick</h2>
    <div id="recs"><div class="cliff">waiting for your slot / next pick…</div></div>
    <div id="cliffs" style="margin-top:10px"></div>
  </section>
  <section>
    <h2>Best available</h2>
    <div id="avail"></div>
  </section>
  <section>
    <h2>Your roster</h2>
    <div id="roster"></div>
    <div class="needs" id="needs"></div>
    <h2 style="margin-top:16px">Recent picks</h2>
    <div id="recent" class="recent"></div>
  </section>
</main>
<div class="foot">VOR + Monte-Carlo · projections ESPN · Vegas Odds API · live Sleeper feed</div>

<script>
const $ = id => document.getElementById(id);
// escape API-sourced strings (player names, opponent team names) before innerHTML — leaguemates control team names
const esc = s => s==null?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const posEl = p => `<span class="pos" style="color:var(--${p});background:color-mix(in srgb,var(--${p}) 15%,transparent)">${p}</span>`;
const slotInput = $('slot');
slotInput.value = localStorage.getItem('slot') || '';
slotInput.oninput = () => { localStorage.setItem('slot', slotInput.value); tick(); };

// player lookup — search any player for value + availability
const searchInput=$('search'); let searchTimer;
searchInput.oninput=()=>{
  clearTimeout(searchTimer);
  const q=searchInput.value.trim();
  if(q.length<2){ $('searchresults').innerHTML=''; return; }
  searchTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`/api/player?q=${encodeURIComponent(q)}`);
      const d=await r.json();
      $('searchresults').innerHTML=(d.results||[]).map(p=>`
        <div class="sr">${posEl(p.pos)}<span class="nm">${esc(p.name)}${injTag(p.inj)}</span>
          <span class="${p.available?'avail':'taken'}">${p.available?'● AVAILABLE':'✗ DRAFTED'}</span>
          <span class="meta"><b>vor</b> ${Math.round(p.vor)} &nbsp;<b>adp</b> ${p.adp.toFixed(1)} &nbsp;${esc(p.team||'')}${p.bye?' B'+p.bye:''}</span></div>`).join('')
        || '<div class="cliff">no match</div>';
    }catch(e){ $('searchresults').innerHTML=''; }
  }, 250);
};

function injTag(s){ return s ? ` <span class="inj">${esc(s)}</span>` : ''; }
// DEF smarts: Week-1 matchup softness + roster conflict
function defTag(d){
  if(!d) return '';
  let out='';
  if(d.matchup){
    const pts=d.matchup.opp_pts, soft=pts<20, hard=pts>24;
    const c=soft?'var(--green)':hard?'var(--red)':'var(--dim)';
    out+=` <span style="color:${c};font-size:11px" title="Week 1: faces ${esc(d.matchup.opp)} (${pts} implied pts)">W1 vs ${esc(d.matchup.opp)} ${soft?'🟢':hard?'🔴':''}</span>`;
  }
  if(d.conflict>0) out+=` <span style="color:var(--yellow);font-size:11px" title="plays ${d.conflict} of your rostered teams (division) — negative correlation">⚠ hits ${d.conflict} of yours</span>`;
  return out;
}
// survival-to-your-next-pick badge (bucketed per the turn-strategy spec)
function survBadge(s){
  if(s==null) return '';
  const pct=Math.round(s*100);
  let c,l;
  if(s>=0.85){c='s-back';l='comes back';}
  else if(s>=0.60){c='s-likely';l='likely back';}
  else if(s>=0.35){c='s-coin';l='coin flip';}
  else if(s>=0.15){c='s-slip';l='slipping';}
  else {c='s-gone';l='take now';}
  return `<span class="surv ${c}" title="${pct}% still available at your next pick">${pct}% ${l}</span>`;
}

function render(s){
  $('err').textContent = '';
  $('pick').innerHTML = `${s.round}.${String(s.in_round).padStart(2,'0')} <small>#${s.overall}/${s.total}</small>`;
  const b = $('banner');
  if(s.is_mine){ b.className='banner mine'; b.textContent='● YOUR PICK'; }
  else if(s.status!=='drafting' && s.status!=='in_progress'){ b.className='banner waiting'; b.textContent=s.status.replace('_',' '); }
  else { b.className='banner waiting'; b.textContent = 'on clock: ' + (s.on_team || ('slot '+s.on_slot)); }
  if(s.my_next) b.textContent += `  ·  your next #${s.my_next}` + (s.picks_away? ` (${s.picks_away} away)`:'');

  // slot source — make a stale manual override visible
  const si = $('slotinfo');
  if(!s.slot){ si.textContent=''; }
  else if(s.slot_source==='auto'){
    si.style.color='var(--green)'; si.textContent=`slot ${s.slot} ✓ auto`;
    if(slotInput.value && Number(slotInput.value)!==s.slot){ si.style.color='var(--yellow)'; si.textContent=`slot ${s.slot} (auto — ignoring your box ${slotInput.value})`; }
  } else { si.style.color='var(--yellow)'; si.textContent=`slot ${s.slot} (manual — auto once draft starts)`; }

  // position-run alert + elites-left
  const rb=$('runbar');
  const el=s.elites_left||{};
  const elBits=['RB','WR','TE','QB'].filter(p=>el[p]!=null).map(p=>`${p}: ${el[p]} startable left`).join('  ·  ');
  if(s.runs && s.runs.length){
    rb.style.display='block';
    rb.innerHTML=`⚠ ${esc(s.runs.join(' & '))} run in progress — grab the last elite before the cliff${elBits?'  ·  '+esc(elBits):''}`;
  } else if(elBits){ rb.style.display='block'; rb.style.background='transparent'; rb.style.border='0'; rb.style.color='var(--dim)'; rb.innerHTML=elBits; }
  else { rb.style.display='none'; }

  // recommendations — realistic targets at YOUR pick, not the best on the board
  const recRow=(r,i,top)=>`
      <div class="rec ${top?'top':''}">
        <span class="rk">${top?'➤':i}</span>${posEl(r.pos)}
        <span class="nm">${esc(r.name)}${r.stack?' <span class="stack" title="stacks with your roster (QB↔pass-catcher)">🔗 stack</span>':''}${injTag(r.inj)}</span>
        ${survBadge(r.survive)}
        <span class="meta"><b>vor</b> ${Math.round(r.vor)} &nbsp;<b>adp</b> ${r.adp.toFixed(1)}</span>
        <span class="exp" title="expected regular-season wins">${r.exp.toFixed(1)}w</span>
      </div>`;
  if(s.recommendations && s.recommendations.length){
    let html='';
    if(s.pair && s.pair.length>=2 && s.my_picks && s.my_picks.length>=2)
      html+=`<div class="pairplan">🎯 your next two picks (#${s.my_picks[0]} &amp; #${s.my_picks[1]}): target <b>${esc(s.pair[0])}</b> + <b>${esc(s.pair[1])}</b></div>`;
    html+=s.recommendations.map((r,i)=>recRow(r,i+1,i===0)).join('');
    if(s.fallers && s.fallers.length){
      html+=`<div class="fallhdr">snap if they fall to you</div>`;
      html+=s.fallers.map(r=>recRow(r,'',false)).join('');
    }
    $('recs').innerHTML=html;
  } else {
    $('recs').innerHTML = `<div class="cliff">${s.slot? 'waiting for next pick…':'set your slot above to get recommendations'}</div>`;
  }
  $('cliffs').innerHTML = (s.cliffs||[]).map(c=>
    `<div class="cliff ${c.steep?'steep':''}">${esc(c.pos)} cliff: ${esc(c.name)} → −${c.drop} vor to 3rd ${c.steep?'◀ grab now':''}</div>`).join('');

  // best available
  const myByes=new Set(Object.keys(s.bye_warn||{}).map(Number));
  $('avail').innerHTML = s.best_available.map(p=>`
    <div class="row">${posEl(p.pos)}<span class="nm">${esc(p.name)}${p.stack?' <span class="stack" title="stacks with your roster">🔗</span>':''}${p.block?` <span class="block" title="handcuff to ${esc(p.block.stud)} — owned by ${esc(p.block.owner)} (leverage play)">🔒 ${esc(p.block.stud)}'s backup</span>`:''}${p.cliff?' <span class="cliffmark" title="last player before a tier cliff">▼</span>':''}${injTag(p.inj)}</span>
      ${survBadge(p.survive)}
      <span class="meta"><b>vor</b> ${Math.round(p.vor)} &nbsp;<b>adp</b> ${p.adp.toFixed(1)} &nbsp;${esc(p.team||'')}${p.bye?` <span class="${myByes.has(p.bye)?'byeclash':'byetag'}" title="bye week ${p.bye}${myByes.has(p.bye)?' — you already have players on this bye':''}">B${p.bye}</span>`:''}${defTag(p.def)}</span></div>`).join('');

  // roster + needs
  $('roster').innerHTML = s.my_roster.length ? s.my_roster.map(p=>`
    <div class="row">${posEl(p.pos)}<span class="nm">${esc(p.name)}${p.hc?` <span class="hc" title="handcuff — grab as insurance">hc:${esc(p.hc)}</span>`:''}</span><span class="meta">${p.bye?'B'+p.bye+' ':''}${p.pts}</span></div>`).join('')
    : '<div class="cliff">no picks yet</div>';
  const bw=s.bye_warn||{};
  const bwk=Object.keys(bw);
  $('roster').innerHTML += bwk.length ? `<div class="cliff steep" style="margin-top:6px">⚠ stacked bye: ${bwk.map(w=>`Wk${w} (${bw[w]})`).join(', ')}</div>` : '';
  const nd = s.needs||[];
  const ne = $('needs');
  if(!s.slot){ ne.textContent=''; }
  else if(nd.length){ ne.className='needs'; ne.textContent='need: '+nd.join(' '); }
  else { ne.className='needs full'; ne.textContent='✓ starters full — best available'; }

  // recent
  $('recent').innerHTML = (s.recent||[]).map(r=>
    `<div><span class="p">#${r.pick} ${esc(r.pos)}</span> ${esc(r.name)} <span class="p">→ ${esc(r.who)}</span></div>`).join('');
}

let ticking=false;
async function tick(){
  if(ticking) return; ticking=true;
  $('live').style.background='var(--yellow)';
  $('clock').textContent='⟳ updating…';
  try{
    const slot = slotInput.value || 0;
    const r = await fetch(`/api/state?slot=${slot}`);
    const s = await r.json();
    if(s.error){ $('err').textContent='error: '+s.error; $('live').style.background='var(--red)'; $('clock').textContent='error'; return; }
    render(s);
    $('err').textContent='';
    $('live').style.background='var(--green)';
    $('clock').textContent='live · '+new Date().toLocaleTimeString();
  }catch(e){
    $('err').textContent='connection lost — retrying…';
    $('live').style.background='var(--red)';
    $('clock').textContent='reconnecting…';
  } finally { ticking=false; }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
